name: Test
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  merge_group:
    branches:
      - '**'
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.5

      - name: Install dependencies
        run: gem install bundler && bundle install --jobs 4 --retry 3

      - name: Init db for ruBee internals
        run: RACK_ENV=test bin/rubee db init

      - name: Run migrations for ruBee internals
        run: |
          RACK_ENV=test bin/rubee db run:create_users
          RACK_ENV=test bin/rubee db run:all

      - name: Run ruBee internals minitest
        run: RACK_ENV=test bin/rubee test

      - name: Build and install gem for dummy project
        run: |
          gem build rubee.gemspec
          gem install ru.Bee-*.gem

      - name: Create dummy project
        run: rm -rf my_project && RACK_ENV=test rubee project my_project

      - name: Run bundle for the dummy project
        working-directory: my_project
        run: bundle install

      - name: Run db init for the dummy project
        working-directory: my_project
        run: RACK_ENV=test bin/rubee db init

      - name: Run all migrations for the dummy project
        working-directory: my_project
        run: RACK_ENV=test bin/rubee db run:all

      - name: Run Minitests for the dummy project
        working-directory: my_project
        run: RACK_ENV=test bin/rubee test
